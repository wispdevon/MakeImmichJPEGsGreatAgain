# Add inside the SAME server {} block that serves your Immich origin.
# This example assumes nginx runs on the Docker host. For nginx in Docker,
# join the Immich network and use http://raw-jpeg:8099 instead.
location /raw-jpeg/ {
    proxy_pass http://127.0.0.1:8100;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header Cookie $http_cookie;
    proxy_read_timeout 300s;
    proxy_buffering off;
}
