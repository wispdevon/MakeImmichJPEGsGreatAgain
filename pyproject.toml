[project]
name = "make-immich-jpegs-great-again"
version = "0.3.0"
description = "Embedded JPEG downloads from RAW photos beside Immich's download button"
requires-python = ">=3.12,<3.14"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "pillow>=11,<13"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
